apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-woocommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urumi-woocommerce
  template:
    metadata:
      labels:
        app: urumi-woocommerce
    spec:
      hostAliases:
        - ip: "10.96.93.174"
          hostnames:
            - "urumi.local"
      containers:
        - name: woocommerce
          image: urumi-mcp-servers:v3
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8005"
            - name: WOOCOMMERCE_URL
              value: "http://urumi.local"
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-credentials
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-credentials
                  key: WOOCOMMERCE_CONSUMER_SECRET
          ports:
            - containerPort: 8005
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-woocommerce
spec:
  selector:
    app: urumi-woocommerce
  ports:
    - port: 8005
      targetPort: 8005