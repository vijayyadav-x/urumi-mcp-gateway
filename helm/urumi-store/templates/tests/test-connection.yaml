
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "urumi-store.fullname" . }}-test-connection"
  labels:
    app: {{ include "urumi-store.fullname" . }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "urumi-store.fullname" . }}:{{ .Values.wordpress.servicePort }}']
  restartPolicy: Never
