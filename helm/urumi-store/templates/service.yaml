
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi-store.fullname" . }}
  labels:
    app: {{ include "urumi-store.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "urumi-store.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.wordpress.servicePort }}
      targetPort: http
      protocol: TCP
