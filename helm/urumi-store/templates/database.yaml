
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urumi-store.fullname" . }}-db
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
  root-password: {{ .Values.database.rootPassword | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "urumi-store.fullname" . }}-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: {{ .Values.database.storage | quote }}
