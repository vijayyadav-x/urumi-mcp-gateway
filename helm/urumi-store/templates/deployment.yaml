
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi-store.fullname" . }}
  labels:
    app: {{ include "urumi-store.fullname" . }}
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app: {{ include "urumi-store.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "urumi-store.fullname" . }}
    spec:
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "urumi-store.fullname" . }}-db:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.database.databaseName | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.database.username | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi-store.fullname" . }}-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ include "urumi-store.fullname" . }}-wordpress
