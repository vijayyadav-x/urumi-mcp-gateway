
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi-store.fullname" . }}
  labels:
    app: {{ include "urumi-store.fullname" . }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host | default "urumi.local" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi-store.fullname" . }}
                port:
                  number: {{ .Values.wordpress.servicePort }}
{{- end }}
